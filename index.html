        /* ==========================================================================
           1. СИСТЕМНЫЕ СТИЛИ И ПРЕМИАЛЬНЫЙ АНИМИРОВАННЫЙ ФОН
           ========================================================================== */
        :root {
            --bg-pure: #050505;
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --bg-light-gray: #1f1f1f;
            --accent-orange: #ff9900;

            --text-pure: #ffffff;
            --text-muted: #aaaaaa;
            --text-dark: #0d0d0d;
            --border-color: #2a2a2a;
            --neon-shadow: rgba(255, 153, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: var(--text-pure);
            background: linear-gradient(-45deg, #050505, #121212, #241103, #171101, #0a0a0a);
            background-size: 400% 400%;
            animation: grandGradient 20s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes grandGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 40px;
        }

        h1, h2, h3, h4 {
            margin: 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* Полоса прокрутки */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-pure); }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-light-gray);
            border: 2px solid var(--bg-pure);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-orange); }

            max-width: 800px;

.pricing-section {

.process-card .step-num {

========================================================================== */
.lead-capture-section {

}
.lead-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 80px;

}
.lead-info-text h2 {

letter-spacing: 0.5px;
}
.input-group-field input, .input-group-field select {

border: 1px solid var(--border-color);
color: white;
padding: 16px;
font-size: 16px;
border-radius: 6px;
transition: border-color 0.3s;
}
.input-group-field input:focus, .input-group-field select:focus {

}
.form-policy-note {
font-size: 12px;
color: var(--text-muted);
text-align: center;
line-height: 1.4;
margin: 0;
}

8. ОФИЦИАЛЬНАЯ ГАРАНТИЯ

.warranty-section { padding: 80px 0; }
.warranty-banner-box {

.warranty-seal {

.warranty-text-box h3 {

margin-bottom: 12px;
}
.warranty-text-box p {

line-height: 1.6;

margin: 0;
}

9. БАЗА FAQ (АККОРДЕОН)
========================================================================== */
.faq-section { padding: 100px 0; }
.faq-accordion-wrapper {

gap: 15px;

.faq-item-node {

.faq-trigger-button:hover { color: var(--accent-yellow); }

}
.faq-content-panel {

line-height: 1.6;

.footer-gis-section {

.gis-grid {

}

}

}
.footer-column h5 {

text-transform: uppercase;
}
.footer-column ul {
list-style: none;
padding: 0;

display: flex;
flex-direction: column;
gap: 12px;
}
.footer-column ul a:hover { color: var(--accent-orange); }
.footer-bottom-copyright {
border-top: 1px solid var(--border-color);
padding-top: 30px;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 20px;
}
/* ==========================================================================
11. АДАПТИВНОСТЬ ПОД МОБИЛЬНЫЕ УСТРОЙСТВА
========================================================================== */
@media (max-width: 1200px) {
.hero-content h1 { font-size: 48px; }
.pricing-layout { grid-template-columns: 1fr; }
.brands-grid { grid-template-columns: repeat(4, 1fr); }
.footer-matrix-links { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 992px) {
.hero-grid { grid-template-columns: 1fr; text-align: center; }
.hero-stats-badge { margin-top: 20px; flex-direction: row; justify-content: space-around; }

.cta-group { justify-content: center; }
.lead-grid { grid-template-columns: 1fr; gap: 40px; }
.gis-grid { grid-template-columns: 1fr; }
.giant-map-frame { height: 380px; }
.process-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
.container { padding: 0 20px; }
.main-header .container { flex-direction: column; gap: 20px; text-align: center; }
.header-phone-block { text-align: center; }
.header-support-pills { justify-content: center; }
.top-bar { display: none; }
.hero-content h1 { font-size: 36px; }
.hero-stats-badge { flex-direction: column; gap: 20px; }
.brands-grid { grid-template-columns: repeat(2, 1fr); }
.footer-matrix-links { grid-template-columns: 1fr; }
.price-table-container { padding: 20px; }
.table-row-item { flex-direction: column; align-items: flex-start; gap: 15px; }
.service-pricing-col { width: 100%; justify-content: space-between; }
}

Часто задаваемые вопросы
Собрали важные ответы, которые помогут вам сориентироваться перед визитом в нашу лабораторию.



Сколько времени занимает диагностика? ▼

Экспресс-тестирование основных модулей занимает около 15-20 минут. Если дефект скрытый (например, блуждающее короткое замыкание), углубленная диагностика может занять до 1 рабочего дня.



Сохранятся ли данные на моем устройстве? ▼

При стандартном модульном ремонте (замена экрана, АКБ) данные не затрагиваются. При сложных ремонтах процессора мы рекомендуем делать резервные копии.
