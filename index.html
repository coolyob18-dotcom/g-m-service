<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>О компании | G-M Service</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* ========== СБРОС И ПЕРЕМЕННЫЕ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F5F5;
            --accent-orange: #FF8C00;
            --accent-yellow: #FFD700;
            --orange-dim: rgba(255, 140, 0, 0.1);
            --yellow-dim: rgba(255, 215, 0, 0.1);
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --shadow-color: rgba(255, 140, 0, 0.25);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ========== ХЕДЕР ========== */
        .header {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            height: 70px;
        }
        
        .logo img {
            display: block;
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-orange);
        }

        .header-phone {
            font-size: 1.5rem;
            font-weight: 600;
            color: #FFFFFF;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .header-phone i {
            color: var(--accent-orange);
            font-size: 1.2rem;
        }
        .header-phone:hover {
            color: var(--accent-orange);
        }

        /* ========== ГЕРОЙ СТРАНИЦЫ ========== */
        .page-hero {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: white;
            padding: 100px 0;
            text-align: center;
            position: relative;
        }
        .page-hero h1 {
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }
        .page-hero h1 span {
            color: var(--accent-orange);
        }
        .page-hero p {
            font-size: 1.3rem;
            color: #cccccc;
            max-width: 700px;
            margin: 0 auto;
            font-weight: 400;
        }

        /* ========== ИСТОРИЯ ========== */
        .about-section {
            padding: 100px 0;
            background: var(--bg-primary);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 60px;
            align-items: center;
        }

        .about-text h2 {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 25px;
            color: var(--text-primary);
        }
        .about-text h2 span {
            color: var(--accent-orange);
        }
        .about-text p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--text-secondary);
        }
        .about-text strong {
            color: var(--accent-orange);
            font-weight: 600;
        }

        .about-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .feature-box {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 16px;
            border-left: 4px solid var(--accent-orange);
        }
        .feature-box h4 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: var(--text-primary);
        }
        .feature-box p {
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        /* ========== ТАЙМЛАЙН ========== */
        .timeline {
            background: var(--bg-secondary);
            padding: 100px 0;
        }
        .section-title {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 60px;
        }
        .section-title span {
            color: var(--accent-orange);
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }
        .timeline-card {
            background: var(--bg-primary);
            border-radius: 24px;
            padding: 35px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }
        .timeline-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 30px -10px var(--shadow-color);
            border-color: var(--accent-orange);
        }
        .timeline-year {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-orange);
            margin-bottom: 15px;
            font-family: 'Space Grotesk', sans-serif;
        }
        .timeline-icon {
            font-size: 2.5rem;
            color: var(--accent-yellow);
            margin-bottom: 20px;
        }
        .timeline-card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }
        .timeline-card p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* ========== БРЕНДЫ ========== */
        .brands {
            padding: 100px 0;
            background: var(--bg-primary);
        }
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
        }
        .brand-item {
            background: var(--bg-secondary);
            padding: 18px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            color: var(--text-primary);
        }
        .brand-item:hover {
            background: var(--bg-primary);
            border-color: var(--accent-orange);
            color: var(--accent-orange);
            box-shadow: 0 5px 15px var(--orange-dim);
            transform: scale(1.05);
        }

        /* ========== КНОПКА НАЗАД ========== */
        .back-btn-container {
            text-align: center;
            padding: 60px 0 100px;
            background: var(--bg-secondary);
        }
        .neon-btn {
            background: transparent;
            color: var(--accent-orange);
            border: 1.5px solid var(--accent-orange);
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            border-radius: 4px;
        }
        .neon-btn:hover {
            background: var(--accent-orange);
            color: white;
            box-shadow: 0 0 30px var(--shadow-color);
            transform: scale(1.02);
        }

        /* ========== ФУТЕР ========== */
        .footer {
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            background: var(--bg-primary);
        }

        /* ========== АДАПТАЦИЯ ========== */
        @media (max-width: 1024px) {
            .about-grid { grid-template-columns: 1fr; gap: 40px; }
            .timeline-grid { grid-template-columns: repeat(2, 1fr); }
            .brands-grid { grid-template-columns: repeat(4, 1fr); }
            .page-hero h1 { font-size: 3rem; }
        }
        @media (max-width: 768px) {
            .container { padding: 0 16px; }
            .header .container { flex-direction: column; gap: 15px; }
            .logo { height: 55px; }
            .logo img { height: 45px; }
            .header-phone { font-size: 1.2rem; }
            .timeline-grid { grid-template-columns: 1fr; }
            .brands-grid { grid-template-columns: repeat(2, 1fr); }
            .page-hero h1 { font-size: 2.2rem; }
