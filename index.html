<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-M Service — Федеральная сеть ремонта цифровой техники</title>
<meta name="description" content="G-M Service — сеть сервисных центров в 47 городах России. Ремонт смартфонов, ноутбуков, планшетов и техники Apple. 20 минут — и ваш гаджет как новый.">
<style>
/* ============================================================
   ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
   ============================================================ */
:root {
  --black: #050505;
  --dark: #0d0d0d;
  --dark-2: #141414;
  --card: #171717;
  --line: rgba(255,255,255,0.07);
  --orange: #FF7A00;
  --orange-2: #FF9500;
  --yellow: #FFD400;
  --white: #FFFFFF;
  --grey: #A0A0A0;
  --grey-dark: #6a6a6a;
  --green: #25D366;
  --blue: #229ED9;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: var(--black);
  color: var(--white);
  overflow-x: hidden;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ============================================================
   ТИПОГРАФИКА
   ============================================================ */
.h1 {
  font-size: clamp(38px, 5vw, 72px);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -1.5px;
}
.h2 {
  font-size: clamp(30px, 3.6vw, 52px);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -1px;
  margin-bottom: 16px;
}
.h3 {
  font-size: clamp(22px, 2vw, 30px);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -0.5px;
}
.lead {
  font-size: clamp(16px, 1.3vw, 20px);
  color: var(--grey);
  line-height: 1.6;
}
.accent { color: var(--yellow); }
.accent-o { color: var(--orange); }
.gradient-text {
  background: linear-gradient(120deg, var(--yellow) 0%, var(--orange) 60%, #FF5500 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.section-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--orange);
  margin-bottom: 18px;
}
.section-label::before {
  content: '';
  width: 28px; height: 2px;
  background: var(--orange);
  box-shadow: 0 0 8px var(--orange);
}

section {
  padding: 110px 0;
  position: relative;
}

/* ============================================================
   КНОПКИ
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 18px 36px;
  font-size: 16px;
  font-weight: 800;
  border-radius: 14px;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  letter-spacing: -0.2px;
  white-space: nowrap;
  cursor: pointer;
}
.btn:hover { transform: translateY(-3px); }
.btn-primary {
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  color: #050505;
  box-shadow: 0 12px 32px rgba(255,122,0,0.35);
}
.btn-primary:hover { box-shadow: 0 18px 44px rgba(255,150,0,0.55); }
.btn-secondary {
  background: rgba(255,255,255,0.06);
  color: var(--white);
  border: 1px solid rgba(255,255,255,0.12);
}
.btn-secondary:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,122,0,0.5);
}
.btn-ghost {
  background: transparent;
  color: var(--yellow);
  border: 2px solid var(--orange);
}
.btn-ghost:hover {
  background: rgba(255,122,0,0.1);
  box-shadow: 0 0 24px rgba(255,122,0,0.35);
}
.btn-lg { padding: 22px 44px; font-size: 18px; }
.btn-sm { padding: 12px 22px; font-size: 14px; }

/* ============================================================
   ШАПКА
   ============================================================ */
.topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: rgba(5,5,5,0.7);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--line);
  transition: all 0.3s;
}
.topnav.scrolled {
  background: rgba(5,5,5,0.95);
  border-bottom-color: rgba(255,122,0,0.3);
  box-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.topnav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 76px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.5px;
}
.brand-mark {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 8px 24px rgba(255,122,0,0.5);
  position: relative;
}
.brand-mark::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  filter: blur(12px);
  opacity: 0.5;
  z-index: -1;
}
.brand-text { color: var(--white); }
.brand-text span { color: var(--yellow); }

.nav-menu {
  display: flex;
  gap: 34px;
  align-items: center;
}
.nav-menu a {
  font-size: 14px;
  font-weight: 600;
  color: var(--grey);
  transition: color 0.2s;
  position: relative;
}
.nav-menu a:hover { color: var(--yellow); }
.nav-menu a::after {
  content: '';
  position: absolute;
  bottom: -6px; left: 0;
  width: 0; height: 2px;
  background: var(--orange);
  transition: width 0.25s;
  box-shadow: 0 0 6px var(--orange);
}
.nav-menu a:hover::after { width: 100%; }

.nav-phone {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.nav-phone a {
  font-size: 17px;
  font-weight: 800;
  color: var(--yellow);
  letter-spacing: -0.3px;
}
.nav-phone small {
  font-size: 11px;
  color: var(--grey-dark);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ============================================================
   HERO
   ============================================================ */
.hero {
  min-height: 100vh;
  padding: 130px 0 60px;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -30%; right: -20%;
  width: 900px; height: 900px;
  background: radial-gradient(circle, rgba(255,122,0,0.22) 0%, transparent 60%);
  filter: blur(60px);
  animation: pulse 8s ease-in-out infinite alternate;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -30%; left: -20%;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(255,212,0,0.14) 0%, transparent 60%);
  filter: blur(60px);
  animation: pulse 10s ease-in-out infinite alternate-reverse;
}
@keyframes pulse {
  0%   { transform: scale(1) translate(0,0); opacity: 0.8; }
  100% { transform: scale(1.15) translate(40px,-30px); opacity: 1; }
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 80px;
  align-items: center;
  position: relative;
  z-index: 2;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  background: rgba(255,122,0,0.1);
  border: 1px solid rgba(255,122,0,0.35);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 700;
  color: var(--yellow);
  margin-bottom: 28px;
  letter-spacing: 0.3px;
}
.hero-eyebrow .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  animation: blink 2s infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.hero .h1 { margin-bottom: 24px; }
.hero .lead { margin-bottom: 40px; max-width: 560px; font-size: 19px; }

.hero-cta {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 44px;
}

.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  padding-top: 36px;
  border-top: 1px solid var(--line);
}
.hero-stat .num {
  font-size: 40px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1.5px;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-stat .label {
  font-size: 13px;
  color: var(--grey);
  margin-top: 8px;
  line-height: 1.4;
}

/* ============================================================
   ВИЗУАЛЬНАЯ ЧАСТЬ HERO
   ============================================================ */
.hero-visual {
  position: relative;
  aspect-ratio: 1;
}
.hero-visual .orb {
  position: absolute;
  inset: 5%;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,212,0,0.3), rgba(255,122,0,0.15) 40%, transparent 70%);
  filter: blur(20px);
  animation: rotate 30s linear infinite;
}
@keyframes rotate {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.hero-card {
  position: absolute;
  background: rgba(20,20,20,0.9);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,122,0,0.3);
  border-radius: 20px;
  padding: 20px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: float 6s ease-in-out infinite;
}
.hero-card-1 {
  top: 8%; left: 0;
  animation-delay: 0s;
}
.hero-card-2 {
  top: 42%; right: 0;
  animation-delay: 1.5s;
}
.hero-card-3 {
  bottom: 8%; left: 15%;
  animation-delay: 3s;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-16px); }
}

.hero-card .hc-icon {
  font-size: 24px;
  margin-bottom: 8px;
}
.hero-card .hc-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--yellow);
  margin-bottom: 4px;
}
.hero-card .hc-sub {
  font-size: 12px;
  color: var(--grey);
}

.hero-phone-mock {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 55%;
  aspect-ratio: 9 / 19;
  background: linear-gradient(160deg, #1a1a1a, #0a0a0a);
  border-radius: 42px;
  border: 3px solid #2a2a2a;
  box-shadow:
    0 40px 100px rgba(0,0,0,0.8),
    inset 0 0 60px rgba(255,122,0,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.hero-phone-mock::before {
  content: '';
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  width: 90px; height: 26px;
  background: #050505;
  border-radius: 20px;
}
.hero-phone-screen {
  position: absolute;
  inset: 8px;
  border-radius: 36px;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,122,0,0.3), transparent 60%),
    linear-gradient(160deg, #1a1a1a, #000);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 40px 24px;
}
.hero-phone-screen .ps-icon {
  font-size: 56px;
  filter: drop-shadow(0 0 20px rgba(255,122,0,0.6));
}
.hero-phone-screen .ps-text {
  font-size: 14px;
  font-weight: 700;
  color: var(--yellow);
  text-align: center;
  line-height: 1.4;
}
.hero-phone-screen .ps-bar {
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 10px;
}
.hero-phone-screen .ps-bar div {
  height: 100%;
  width: 78%;
  background: linear-gradient(90deg, var(--orange), var(--yellow));
  box-shadow: 0 0 14px var(--orange);
  animation: fillBar 3s ease-in-out infinite alternate;
}
@keyframes fillBar {
  0% { width: 30%; }
  100% { width: 92%; }
}

/* ============================================================
   ЛЕНТА ЛОГОТИПОВ
   ============================================================ */
.brands-strip {
  padding: 40px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
  position: relative;
}
.brands-strip::before,
.brands-strip::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 120px;
  z-index: 2;
  pointer-events: none;
}
.brands-strip::before {
  left: 0;
  background: linear-gradient(90deg, var(--black), transparent);
}
.brands-strip::after {
  right: 0;
  background: linear-gradient(270deg, var(--black), transparent);
}
.brands-track {
  display: flex;
  gap: 80px;
  animation: scroll 40s linear infinite;
  width: max-content;
}
@keyframes scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.brand-logo {
  font-size: 26px;
  font-weight: 900;
  color: rgba(255,255,255,0.25);
  letter-spacing: -1px;
  white-space: nowrap;
  transition: color 0.3s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-logo:hover { color: rgba(255,212,0,0.6); }

/* ============================================================
   ЦИФРЫ
   ============================================================ */
.numbers {
  background: linear-gradient(180deg, var(--black), var(--dark));
}
.numbers-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
}
.number-card {
  text-align: center;
  padding: 40px 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--line);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.number-card::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 60%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--orange), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}
.number-card:hover {
  border-color: rgba(255,122,0,0.4);
  background: rgba(255,122,0,0.04);
  transform: translateY(-6px);
}
.number-card:hover::before { opacity: 1; }

.number-card .big {
  font-size: 62px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -3px;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}
.number-card .big span {
  font-size: 32px;
  vertical-align: top;
}
.number-card .desc {
  font-size: 14px;
  color: var(--grey);
  line-height: 1.5;
  font-weight: 500;
}

/* ============================================================
   УСЛУГИ
   ============================================================ */
.services {
  background: var(--dark);
}
.services-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 40px;
  margin-bottom: 60px;
  flex-wrap: wrap;
}
.services-head .h2 { max-width: 600px; margin-bottom: 0; }

.services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.service-card {
  position: relative;
  padding: 36px 32px;
  background: linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border: 1px solid var(--line);
  border-radius: 24px;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  cursor: pointer;
}
.service-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  background: radial-gradient(circle at top right, rgba(255,122,0,0.15), transparent 50%);
  opacity: 0;
  transition: opacity 0.35s;
  pointer-events: none;
}
.service-card:hover {
  transform: translateY(-8px);
  border-color: rgba(255,122,0,0.5);
  box-shadow: 0 24px 60px rgba(255,122,0,0.15);
}
.service-card:hover::after { opacity: 1; }

.service-card .sc-icon {
  width: 68px; height: 68px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(255,212,0,0.15), rgba(255,122,0,0.15));
  border: 1px solid rgba(255,122,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin-bottom: 24px;
  transition: transform 0.3s;
}
.service-card:hover .sc-icon { transform: scale(1.1) rotate(-4deg); }

.service-card h3 {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}
.service-card p {
  font-size: 15px;
  color: var(--grey);
  line-height: 1.6;
  margin-bottom: 24px;
}
.service-card .sc-price {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 14px;
  color: var(--grey);
  padding-top: 20px;
  border-top: 1px solid var(--line);
}
.service-card .sc-price strong {
  font-size: 26px;
  font-weight: 900;
  color: var(--yellow);
  letter-spacing: -1px;
}
.service-card .sc-arrow {
  position: absolute;
  top: 36px; right: 32px;
  font-size: 22px;
  color: var(--orange);
  opacity: 0;
  transform: translateX(-8px);
  transition: all 0.3s;
}
.service-card:hover .sc-arrow {
  opacity: 1;
  transform: translateX(0);
}

/* ============================================================
   КАЛЬКУЛЯТОР
   ============================================================ */
.calc {
  background:
    radial-gradient(circle at 20% 30%, rgba(255,122,0,0.1), transparent 50%),
    var(--black);
}
.calc-shell {
  max-width: 980px;
  margin: 0 auto;
  background: linear-gradient(160deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border: 1px solid rgba(255,122,0,0.25);
  border-radius: 32px;
  padding: 56px 48px;
  box-shadow: 0 40px 100px rgba(0,0,0,0.5);
  position: relative;
  overflow: hidden;
}
.calc-shell::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--orange), var(--yellow), var(--orange), transparent);
}

.calc-steps {
  display: flex;
  gap: 12px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}
.calc-step {
  flex: 1;
  min-width: 180px;
  padding: 18px 22px;
  border-radius: 14px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--line);
  transition: all 0.3s;
  position: relative;
}
.calc-step.active {
  background: rgba(255,122,0,0.1);
  border-color: var(--orange);
  box-shadow: 0 0 24px rgba(255,122,0,0.2);
}
.calc-step.done {
  border-color: rgba(37,211,102,0.4);
  background: rgba(37,211,102,0.05);
}
.calc-step .cs-num {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: var(--orange);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.calc-step.active .cs-num { color: var(--yellow); }
.calc-step.done .cs-num { color: var(--green); }
.calc-step .cs-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--white);
}

.calc-form {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}
.calc-form select {
  padding: 20px 22px;
  background: #0d0d0d;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  color: var(--white);
  font-size: 15px;
  font-weight: 600;
  outline: none;
  cursor: pointer;
  transition: all 0.25s;
  font-family: inherit;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23FF7A00' d='M6 8L0 0h12z'/></svg>");
  background-repeat: no-repeat;
  background-position: right 20px center;
  padding-right: 50px;
}
.calc-form select:hover { border-color: rgba(255,122,0,0.4); }
.calc-form select:focus { border-color: var(--orange); box-shadow: 0 0 20px rgba(255,122,0,0.25); }
.calc-form select:disabled { opacity: 0.4; cursor: not-allowed; }

.calc-result {
  padding: 40px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(255,212,0,0.08), rgba(255,122,0,0.06));
  border: 1px dashed rgba(255,122,0,0.4);
  text-align: center;
  display: none;
}
.calc-result.show { display: block; animation: fadeUp 0.4s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.calc-result .cr-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--orange);
  font-weight: 700;
  margin-bottom: 12px;
}
.calc-result .cr-price {
  font-size: 64px;
  font-weight: 900;
  letter-spacing: -3px;
  line-height: 1;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
}
.calc-result .cr-details {
  color: var(--grey);
  font-size: 16px;
  margin-bottom: 24px;
}
.calc-result .cr-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ============================================================
   ПРОЦЕСС
   ============================================================ */
.process {
  background: var(--dark);
}
.process-track {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  counter-reset: pstep;
  position: relative;
}
.process-track::before {
  content: '';
  position: absolute;
  top: 42px;
  left: 5%;
  right: 5%;
  height: 2px;
  background: linear-gradient(90deg, var(--orange), transparent);
  z-index: 0;
}
.process-step {
  counter-increment: pstep;
  position: relative;
  z-index: 1;
  text-align: center;
  padding-top: 0;
}
.process-step .ps-circle {
  width: 84px; height: 84px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  color: #050505;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: 900;
  margin: 0 auto 24px;
  box-shadow: 0 0 0 8px var(--dark), 0 0 30px rgba(255,122,0,0.5);
  transition: transform 0.3s;
}
.process-step:hover .ps-circle { transform: scale(1.08); }
.process-step h4 {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 10px;
}
.process-step p {
  font-size: 14px;
  color: var(--grey);
  line-height: 1.55;
}

/* ============================================================
   ГАРАНТИЯ
   ============================================================ */
.warranty {
  background: var(--black);
}
.warranty-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}
.warranty-list {
  display: flex;
  flex-direction: column;
  gap: 26px;
  margin-top: 32px;
}
.warranty-item {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}
.warranty-item .wi-check {
  flex-shrink: 0;
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #050505;
  font-size: 20px;
  font-weight: 900;
  box-shadow: 0 8px 20px rgba(255,122,0,0.35);
}
.warranty-item h4 {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 6px;
}
.warranty-item p {
  color: var(--grey);
  font-size: 14px;
  line-height: 1.55;
}

.warranty-visual {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.warranty-badge {
  width: 240px; height: 240px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,212,0,0.15), rgba(255,122,0,0.15));
  border: 2px solid var(--orange);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,122,0,0.4), inset 0 0 60px rgba(255,122,0,0.15);
  position: relative;
}
.warranty-badge::before,
.warranty-badge::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,122,0,0.3);
  animation: ringPulse 3s ease-out infinite;
}
.warranty-badge::before { inset: -30px; animation-delay: 0s; }
.warranty-badge::after  { inset: -60px; animation-delay: 1s; }
@keyframes ringPulse {
  0%   { transform: scale(0.95); opacity: 0.8; }
  100% { transform: scale(1.15); opacity: 0; }
}
.warranty-badge .wb-num {
  font-size: 72px;
  font-weight: 900;
  letter-spacing: -3px;
  line-height: 1;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.warranty-badge .wb-text {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--grey);
  font-weight: 700;
  margin-top: 8px;
}
